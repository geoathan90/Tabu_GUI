name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6 pyinstaller pandas numpy openpyxl xlsxwriter

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller gui/main.py --name Tabu_GUI --onefile --windowed

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tabu_GUI-windows-exe
          path: dist/Tabu_GUI.exe